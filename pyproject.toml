[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ipl-lang"
version = "0.2.0"
description = "IPL (Intelligent Programming Language / Aether) - Neuro-symbolic programming language"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=12.0.0",
    "starlette>=0.20.0",
    "uvicorn>=0.18.0",
    "scikit-learn>=1.0.0",
    "numpy>=1.20.0",
    "torch>=2.0.0",
    "transformers>=4.30.0"
]

[project.scripts]
ipl = "cli:main"

[tool.setuptools]
py-modules = [
    "ast_nodes",
    "autonomous_decision_engine",
    "cli",
    "codebert_firewall",
    "compiler",
    "continual_learning",
    "dynamic_optimizer",
    "formatter",
    "gateway",
    "gnn_engine",
    "lexer",
    "ml_heuristic_generator",
    "parser",
    "runtime",
    "security_engine",
    "semantic_engine",
    "taint",
    "tokens",
]
